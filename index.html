<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Management</title>
  </head>
  <body>
    <form id="form">
      <label for="task-input">Task Name</label>
      <input type="text" id="task-input" placeholder="Enter a task..." />
      <label for="category">Category</label>
      <select id="category">
        <option value="">-- Please Select an Option --</option>
        <option value="work">Work</option>
        <option value="school">School</option>
        <option value="personal">Personal</option>
        <option value="health">Health</option>
        <option value="other">Other</option>
      </select>

      <label for="due-date">Due Date:</label>
      <input type="date" id="due-date" name="due-date" />

      <label for="task-status">Initial Status</label>
      <select id="task-status">
        <option value="progress">In progress</option>
        <option value="completed">Completed</option>
      </select>

      <button type="submit" class="add-task">Add Task</button>
    </form>

    <section class="filter-section">
      <h3>Filters</h3>

      <label for="status-filter">Filter Status</label>
      <select id="status-filter">
        <option value="all">All</option>
        <option value="progress">In progress</option>
        <option value="completed">Completed</option>
        <option value="overdue">Overdue</option>
      </select>

      <label for="category-filter">Filter by Category</label>
      <select id="category-filter">
        <option value="all">All</option>
        <option value="work">Work</option>
        <option value="school">School</option>
        <option value="personal">Personal</option>
        <option value="health">Health</option>
        <option value="other">Other</option>
      </select>
    </section>

    <section class="task-list-section">
      <h2>Your Tasks</h2>
      <ul class="display-tasks"></ul>
    </section>
    <script>
      const form = document.getElementById("form");
      const taskInput = document.getElementById("task-input");
      const category = document.getElementById("category");
      const dueDate = document.getElementById("due-date");
      const taskStatus = document.getElementById("task-status");
      const statusFilter = document.getElementById("status-filter");
      const categoryFilter = document.getElementById("category-filter");

      const displayTasks = document.querySelector(".display-tasks");

      const tasks = JSON.parse(localStorage.getItem("tasks")) || [];

      function saveToLocal() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (
          taskInput.value.trim() === "" ||
          category.value === "" ||
          dueDate.value == ""
        ) {
          alert("Please fill all the fields");
          return;
        }

        const task = {
          name: taskInput.value,
          category: category.value,
          dueDate: dueDate.value,
          status: taskStatus.value,
        };

        tasks.push(task);
        saveToLocal();
        tasksDisplay(tasks);
        form.reset();
      });

      function tasksDisplay(list) {
        displayTasks.innerHTML = "";

        list.forEach((task) => {
          const newTask = document.createElement("li");
          newTask.innerHTML = `
          <strong> ${task.name}</strong>
          <p>Category: ${task.category}</p>
          <p>Due Date: ${task.dueDate}</p>
          <p>Status: ${task.status}</p>
          `;
          if (task.status === "progress") {
            const completeBtn = document.createElement("button");
            completeBtn.textContent = "Mark Complete";
            completeBtn.addEventListener("click", () => {
              task.status = "completed";
              saveToLocal();
              tasksDisplay(tasks);
            });
            newTask.appendChild(completeBtn);
          }

          if (task.status === "completed") {
            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.addEventListener("click", () => {
              const taskIndex = tasks.indexOf(task);
              tasks.splice(taskIndex, 1);
              saveToLocal();
              tasksDisplay(tasks);
            });
            newTask.appendChild(deleteBtn);
          }
          displayTasks.appendChild(newTask);
        });
      }

      statusFilter.addEventListener("change", (e) => {
        const selectedValue = e.target.value;
        let filteredTasks = [];

        if (selectedValue === "all") {
          filteredTasks = tasks;
        } else if (selectedValue === "progress") {
          filteredTasks = tasks.filter((task) => {
            return task.status === "progress";
          });
        } else if (selectedValue === "completed") {
          filteredTasks = tasks.filter((task) => {
            return task.status === "completed";
          });
        } else if (selectedValue === "overdue") {
          filteredTasks = tasks.filter((task) => {
            return (
              task.status !== "completed" && new Date(task.dueDate) < new Date()
            );
          });
        }

        tasksDisplay(filteredTasks);
      });

      categoryFilter.addEventListener("change", (e) => {
        const selectedValue = e.target.value;

        let filteredTasks = [];

        if (selectedValue === "all") {
          filteredTasks = tasks;
        } else {
          filteredTasks = tasks.filter((task) => {
            return task.category === selectedValue;
          });
        }
        tasksDisplay(filteredTasks);
      });

      tasksDisplay(tasks);
    </script>
  </body>
</html>
